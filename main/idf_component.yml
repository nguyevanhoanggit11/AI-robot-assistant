dependencies:
  idf:
    version: '>=5.0.0'

  espressif/es8311: ^1.0
  espressif/esp_lvgl_port:
    version: '>=2.5.0'
  espressif/esp_lvgl_adapter: ^0.5.1
  espressif/esp-sr: '*'
  espressif/esp_websocket_client: '>=1.0.0'
  espressif/esp_wifi_remote:
    matches:
    - if: idf_version >= 6.0
      version: '>=1.6,<2.0'
    - if: idf_version < 6.0
      version: 0.14.*

  espressif/esp_hosted:
    matches:
    - if: idf_version >= 6.0
      version: '>=2.12,<3.0'
    - if: idf_version < 6.0
      version: 1.4.*
  trombik/esp_wireguard: ^0.9.0
lvgl/lvgl: "~9.2.0"
espressif/esp_lv_adapter: "*"     
